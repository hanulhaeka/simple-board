<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="w-50 h-75 text-center">
            <div class="d-flex flex-column h-100">
                <h1 class="title mb-1">Hello Board</h1>

                <div class="d-flex justify-content-between">
                    <h3 class="subheading text-start">게시글 읽기</h3>
                    <a class="btn btn-success" th:href="@{/article/list}">목록으로</a>
                </div>

                <hr class="mb-1" style="color: #000000;">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${articleDto.title}">제목</h5>
                    <span th:text="${#temporals.format(articleDto.time, 'yyyy-MM-dd HH:mm:ss')}"></span>
                </div>
                <hr class="mt-1" style="color: #828282;">
                <pre class="flex-grow-1 text-start" th:text="${articleDto.content}">본문</pre>
                <hr style="color: #000000;">
            </div>
        </div>
        <div th:if="${sessionUser != null and (sessionUser.userId == articleDto.userId or sessionUser.role == T(com.example.simple_board.model.Role).ADMIN)}" class="w-50 d-flex justify-content-between  align-items-start">
            <a class="btn btn-success" th:href="@{/article/update/{id}(id=${articleDto.id})}">수정</a>
            <form th:action="@{/article/delete/{id}(id=${articleDto.id})}" method="post">
                <button class="btn btn-danger" type="submit">삭제</button>
            </form>
        </div>
    </div>
</body>
</html>
