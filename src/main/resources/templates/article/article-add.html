<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Article Add</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="w-50 h-75 text-center">
            <form class="d-flex flex-column h-100 mb-0" th:action="@{/article/add}" th:object="${articleDto}" method="post">
                <h1 class="title mb-5">Hello Board</h1>
                <div class="nav justify-content-between mb-3">
                    <h3 class="subheading">게시글 작성</h3>
                    <div class="d-flex align-items-start mb-3">
                        <div class="flex-grow-1 me-2">
                            <input class="form-control" style="width:auto" th:classappend="${#fields.hasErrors('password')}? 'is-invalid'" type="password" th:field="*{password}" placeholder="비밀번호 입력">
                            <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <button type="submit" class="btn btn-success">저장</button>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('title')}? 'is-invalid'" th:field="*{title}" placeholder="제목 입력">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="flex-grow-1 mb-3">
                    <textarea class="form-control h-100" th:field="*{content}" placeholder="본문 입력"></textarea>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
