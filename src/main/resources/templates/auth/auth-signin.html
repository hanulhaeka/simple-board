<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="w-50 h-75 text-center">
        <h1 class="title mb-5">Hello Board</h1>
        <div class="d-flex flex-column justify-content-center align-items-center">

            <h3 class="subheading text-start w-75 mb-5">로그인</h3>

            <form class="w-75" th:action="@{/auth/signin}" method="post">

                <div th:if="${param.error}" class="alert alert-danger">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <div>
                    <label class="form-label text-start w-100" for="username">아이디</label>
                    <input class="form-control" type="text" id="username" name="username">
                </div>
                <div class="mb-3">
                    <label class="form-label text-start w-100" for="password">비밀번호</label>
                    <input class="form-control" type="password" id="password" name="password">
                </div>
                <button class="btn btn-success" type="submit">로그인</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
